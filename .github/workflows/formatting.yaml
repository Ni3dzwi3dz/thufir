name: Code formatting check
on:
  pull_request:
    branches:
      - "**"
jobs:
  python-lint:
    name: Check code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pre-commit
        run: python -m pip install pre-commit tomlkit
      - name: Run pre-commit
        run: pre-commit run --all-files

  svelte-lint:
    name: Check frontend code quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run ESLint
        run: npx eslint "ui/src/**/*.{js,ts,svelte}"
      - name : Run Prettier
        run: npx prettier --check "ui/src/**/*.{js,ts,svelte}"
      - name: Run check
        run: npm run check
